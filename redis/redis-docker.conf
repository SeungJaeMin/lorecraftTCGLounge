# Redis Configuration for Docker Environment
# Optimized for containerized deployment

# Network - Allow connections from any interface in Docker
bind 0.0.0.0
protected-mode no
port 6379

# General
loglevel notice
databases 16

# Persistence for Docker
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory Management for Container
maxmemory 512mb
maxmemory-policy allkeys-lru

# Docker Health Check Support
# Redis will respond to PING commands
tcp-keepalive 60
timeout 300

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""