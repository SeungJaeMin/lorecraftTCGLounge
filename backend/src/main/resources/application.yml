spring:
  profiles:
    active: dev
  application:
    name: lorecraft-tcg-lounge

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        
  # Redis disabled for development
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     password: 
  #     timeout: 2000ms
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.lorecraft.tcglounge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: lorecraft-tcg-lounge-jwt-secret-key-for-development-very-long-secret
  expiration: 86400 # 24 hours

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
      
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tcg_lounge}
    username: ${DB_USERNAME:tcg_user}
    password: ${DB_PASSWORD:tcg_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.lorecraft.tcglounge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    
jwt:
  secret: ${JWT_SECRET:default-secret}
  expiration: ${JWT_EXPIRATION:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized