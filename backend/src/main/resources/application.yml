spring:
  profiles:
    active: dev
  application:
    name: lorecraft-tcg-lounge

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/tcg_lounge_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:tcg_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tcg_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        discriminator.ignore_explicit_for_joined: true
        default_batch_fetch_size: 10
        jdbc.batch_size: 10
        order_inserts: true
        order_updates: true
        
  # Redis disabled for development
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     password: 
  #     timeout: 2000ms
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: 8090
  servlet:
    context-path: /api

logging:
  level:
    com.lorecraft.tcglounge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

jwt:
  secret: lorecraft-tcg-lounge-jwt-secret-key-for-development-very-long-secret
  expiration: 86400 # 24 hours

---
# Docker Profile  
spring:
  config:
    activate:
      on-profile: docker
      
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/tcg_lounge_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:tcg_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tcg_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        discriminator.ignore_explicit_for_joined: true
        default_batch_fetch_size: 10
        jdbc.batch_size: 10
        order_inserts: true
        order_updates: true
        
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.lorecraft.tcglounge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

jwt:
  secret: ${JWT_SECRET:lorecraft-tcg-lounge-jwt-secret-key-for-development-very-long-secret}
  expiration: ${JWT_EXPIRATION:86400}

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
      
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tcg_lounge}
    username: ${DB_USERNAME:tcg_user}
    password: ${DB_PASSWORD:tcg_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        discriminator.ignore_explicit_for_joined: true
        default_batch_fetch_size: 10
        jdbc.batch_size: 10
        order_inserts: true
        order_updates: true
        
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.lorecraft.tcglounge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    
jwt:
  secret: ${JWT_SECRET:default-secret}
  expiration: ${JWT_EXPIRATION:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

